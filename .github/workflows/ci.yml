name: CI Pipeline

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  frontend:
    name: "Frontend (React.js) — Lint & Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Lint (ESLint)
      #   run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 3

  backend:
    name: "Backend (Laravel) — Lint & Build"
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            composer-
 
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
 
      - name: Copy .env file
        run: cp .env.example .env
 
      - name: Set application environment variables
        run: |
          php artisan key:generate
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_URL: http://localhost
          FRONTEND_URL: http://localhost:5173
          LOG_LEVEL: debug

          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nagorik_ai
          DB_USERNAME: root
          DB_PASSWORD: root

          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

      - name: Validate route & config caching
        run: |
          php artisan config:cache
          php artisan route:cache

      # - name: Lint (Laravel Pint)
      #   run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  database:
    name: "Database (MySQL) — Validate SQL files"
    runs-on: ubuntu-latest
 
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Validate all SQL files
        run: |
          echo "Validating SQL files in /database..."
          FAILED=0
          for file in database/schema/*.sql; do
            echo "  Checking: $file"
            if ! mysql -h 127.0.0.1 -uroot -proot ci_db < "$file" 2>&1; then
              echo "  FAILED: $file"
              FAILED=1
            else
              echo "  OK: $file"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more SQL files failed validation."
            exit 1
          fi
          echo "All SQL files validated successfully."
